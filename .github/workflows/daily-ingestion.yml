name: Daily Data Ingestion & Verification

on:
  schedule:
    # 06:00 UTC = 11:30 AM IST (daily, after POSOCO/NLDC daily reports are published)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ingest-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Ingestion Worker (Yesterday + Catchup)
      run: |
        python utils/ingestion_worker.py --catchup 2

    - name: Run verification test suite
      run: |
        pytest tests/test_ingestion_worker.py -v
